app = 'clinical-ai-muhfai'
primary_region = 'sin'   # Singapore — closest to Malaysia

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # Stops machine after 5 min idle, restarts on next request (~3s cold start)
  # Set min_machines_running = 1 for zero-latency production use
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

[[vm]]
  # 1 GB needed to hold all 4 model pkls in memory + inference overhead
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
